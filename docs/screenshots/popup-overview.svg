<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <rect width="1000" height="760" fill="#eef2f5"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#20242a">
    <rect x="52" y="10" width="430" height="740" rx="18" fill="#f5f6f8" stroke="#d9dde3"/>
    <text x="69" y="47" font-size="18" font-weight="700">GPT AntiCurse</text>
    <text x="69" y="67" font-size="12" fill="#68727d">Long-chat performance guard</text>
    <rect x="410" y="35" width="53" height="29" rx="15" fill="#e6f5f2" stroke="#8fd0c8"/>
    <text x="436" y="54" text-anchor="middle" font-size="11" fill="#0f766e">Active</text>

    <rect x="69" y="84" width="394" height="101" rx="13" fill="#fff" stroke="#d9dde3"/>
    <text x="84" y="135" font-size="34" font-weight="700" fill="#0f766e">6.2 MB</text>
    <text x="205" y="129" font-size="13" fill="#3f464f">response data removed from page state</text>
    <text x="84" y="164" font-size="11" fill="#68727d">83% fewer internal nodes · kept 64 recent conversation units in ChatGPT.</text>

    <rect x="69" y="198" width="394" height="229" rx="13" fill="#fff" stroke="#d9dde3"/>
    <line x1="69" y1="255" x2="463" y2="255" stroke="#d9dde3"/>
    <line x1="69" y1="312" x2="463" y2="312" stroke="#d9dde3"/>
    <line x1="69" y1="369" x2="463" y2="369" stroke="#d9dde3"/>
    <text x="84" y="222" font-size="13" font-weight="700">Performance guard</text><text x="84" y="240" font-size="10" fill="#68727d">Reduce heavy conversation state</text>
    <rect x="415" y="215" width="34" height="20" rx="10" fill="#0f766e"/><circle cx="439" cy="225" r="7" fill="#fff"/>
    <text x="84" y="279" font-size="13" font-weight="700">History mode</text><text x="84" y="297" font-size="10" fill="#68727d">Load older turns with a button</text>
    <rect x="289" y="267" width="160" height="34" rx="8" fill="#f0f2f5" stroke="#c8cdd4"/><text x="369" y="288" text-anchor="middle" font-size="12">Recent N + button</text>
    <text x="84" y="336" font-size="13" font-weight="700">Window size</text><text x="84" y="354" font-size="10" fill="#68727d">Recent units kept natively</text>
    <rect x="395" y="324" width="54" height="34" rx="8" fill="#f0f2f5" stroke="#c8cdd4"/><text x="422" y="346" text-anchor="middle" font-size="12">64</text>
    <text x="84" y="393" font-size="13" font-weight="700">Persistent backup</text><text x="84" y="411" font-size="10" fill="#68727d">Enables Markdown export</text>
    <rect x="415" y="386" width="34" height="20" rx="10" fill="#0f766e"/><circle cx="439" cy="396" r="7" fill="#fff"/>

    <rect x="69" y="438" width="394" height="39" rx="9" fill="#0f766e"/>
    <text x="266" y="463" text-anchor="middle" font-size="12" fill="#fff">Save &amp; reload</text>

    <rect x="69" y="489" width="394" height="217" rx="13" fill="#fff" stroke="#d9dde3"/>
    <text x="84" y="520" font-size="13" font-weight="700">Export this chat</text>
    <rect x="397" y="504" width="52" height="29" rx="15" fill="#e6f5f2" stroke="#8fd0c8"/><text x="423" y="523" text-anchor="middle" font-size="11" fill="#0f766e">Ready</text>
    <text x="84" y="549" font-size="10.5" fill="#68727d">1,842 messages backed up locally · Updated just now</text>
    <line x1="84" y1="562" x2="448" y2="562" stroke="#d9dde3"/>
    <text x="84" y="585" font-size="12" font-weight="700">Export content</text><text x="84" y="603" font-size="9.5" fill="#68727d">Recommended: readable conversation without raw tool-call noise.</text>
    <rect x="84" y="615" width="365" height="35" rx="8" fill="#f0f2f5" stroke="#c8cdd4"/><text x="96" y="637" font-size="11.5">Readable conversation</text>
    <rect x="84" y="660" width="178" height="34" rx="8" fill="#fff" stroke="#c8cdd4"/><text x="173" y="682" text-anchor="middle" font-size="10.5">Download Markdown</text>
    <rect x="270" y="660" width="179" height="34" rx="8" fill="#e6f5f2" stroke="#8fd0c8"/><text x="359" y="682" text-anchor="middle" font-size="10.5" fill="#0f766e">Download &amp; new chat</text>
    <text x="69" y="731" font-size="11" font-weight="650" fill="#3f464f">Technical details</text>

    <text x="529" y="271" font-size="32" font-weight="700">Keep long chats responsive</text>
    <text x="529" y="309" font-size="15" fill="#48515b">AntiCurse reduces the conversation state ChatGPT keeps active</text>
    <text x="529" y="331" font-size="15" fill="#48515b">while leaving older history available when you need it.</text>

    <circle cx="533" cy="368" r="4" fill="#0f766e"/><text x="549" y="373" font-size="14" font-weight="700">See what was reduced</text>
    <text x="549" y="394" font-size="12" fill="#68727d">Payload reduction is shown in KB/MB/GB when it can be measured.</text>
    <circle cx="533" cy="421" r="4" fill="#0f766e"/><text x="549" y="426" font-size="14" font-weight="700">Choose how older history loads</text>
    <text x="549" y="447" font-size="12" fill="#68727d">Use a button or let Auto window load another page when you reach the top.</text>
    <circle cx="533" cy="474" r="4" fill="#0f766e"/><text x="549" y="479" font-size="14" font-weight="700">Export before starting a fresh chat</text>
    <text x="549" y="500" font-size="12" fill="#68727d">Keep final answers only, a readable transcript, or the full technical log.</text>
  </g>
</svg>
