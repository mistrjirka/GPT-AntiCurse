<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#fff"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#202123">
    <rect width="1200" height="52" fill="#fff"/><line x1="0" y1="52" x2="1200" y2="52" stroke="#e5e7eb"/><text x="24" y="32" font-size="14">ChatGPT</text>
    <rect x="0" y="52" width="205" height="708" fill="#f4f4f5"/><line x1="205" y1="52" x2="205" y2="760" stroke="#ececef"/>
    <g fill="#dedfe2"><rect x="18" y="84" width="168" height="12" rx="6"/><rect x="18" y="110" width="122" height="12" rx="6"/><rect x="18" y="136" width="168" height="12" rx="6"/><rect x="18" y="162" width="122" height="12" rx="6"/><rect x="18" y="188" width="168" height="12" rx="6"/></g>

    <rect x="559" y="80" width="139" height="40" rx="20" fill="#f7f7f8" stroke="#d1d5db"/><text x="628" y="105" text-anchor="middle" font-size="13" font-weight="600">Load previous 64</text>
    <text x="710" y="105" font-size="12" fill="#6b7280">1,216 older turns available</text>

    <rect x="647" y="149" width="412" height="42" rx="21" fill="#f0f0f0"/><text x="664" y="175" font-size="13">Can we continue from the earlier implementation discussion?</text>
    <text x="346" y="232" font-size="15">Yes. The recent part of the chat stays in ChatGPT's normal thread, while AntiCurse keeps older visible turns</text>
    <text x="346" y="258" font-size="15">outside the active conversation graph.</text>
    <text x="346" y="295" font-size="15">When you need more context, use <tspan font-weight="700">Load previous</tspan> or Auto window.</text>
    <rect x="346" y="314" width="713" height="61" rx="12" fill="#f3f4f6"/>
    <text x="361" y="339" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">older history → extension-owned bounded DOM</text>
    <text x="361" y="359" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">recent history → native ChatGPT conversation state</text>

    <rect x="642" y="399" width="417" height="42" rx="21" fill="#f0f0f0"/><text x="660" y="425" font-size="13">So I can still scroll back without keeping the whole chat active?</text>
    <text x="346" y="483" font-size="15">Exactly. Loading older history does not put the full conversation graph back into ChatGPT's page state.</text>

    <rect x="238" y="647" width="229" height="85" rx="12" fill="#fff" stroke="#d9dde3"/>
    <text x="251" y="675" font-size="14" font-weight="700">Older history stays reachable</text>
    <text x="251" y="698" font-size="11" fill="#68727d">The extension mounts only a bounded</text><text x="251" y="714" font-size="11" fill="#68727d">number of archived pages at once.</text>

    <rect x="951" y="687" width="231" height="55" rx="28" fill="#0b2529" stroke="#2dd4bf"/>
    <circle cx="966" cy="714" r="4" fill="#2dd4bf"/><text x="977" y="719" font-size="12" font-weight="700" fill="#fff">AntiCurse</text>
    <text x="1038" y="710" font-size="12" fill="#5eead4">6.2 MB</text><text x="1038" y="727" font-size="12" fill="#5eead4">trimmed</text>
    <text x="1106" y="719" font-size="12" fill="#66898d">•</text><text x="1127" y="710" font-size="12" fill="#fff">64</text><text x="1127" y="727" font-size="12" fill="#fff">recent</text>
  </g>
</svg>
