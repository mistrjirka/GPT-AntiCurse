name: Test and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool firefox/manifest.json >/dev/null
          python -m json.tool chrome/manifest.json >/dev/null
          node --check firefox/background.js
          node --check firefox/content.js
          node --check firefox/popup.js
          node --check chrome/main.js
          node --check chrome/content.js
          node --check chrome/popup.js
          node tests/test-trim.js

      - name: Build browser packages
        run: ./scripts/build.sh

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("firefox/manifest.json"))["version"])')"
          CHROME_VERSION="$(python -c 'import json; print(json.load(open("chrome/manifest.json"))["version"])')"
          test "$VERSION" = "$CHROME_VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            dist/gpt-anticurse-firefox-v${VERSION}.zip \
            dist/gpt-anticurse-chrome-v${VERSION}.zip \
            --target "$GITHUB_SHA" \
            --title "GPT AntiCurse $TAG" \
            --notes-file RELEASE_NOTES.md
