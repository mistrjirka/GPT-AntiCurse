name: Test and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate manifests
        run: |
          python -m json.tool firefox/manifest.json >/dev/null
          python -m json.tool chrome/manifest.json >/dev/null
      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in firefox/*.js chrome/*.js tests/*.js; do node --check "$file"; done
      - name: Verify shared browser code stays in sync
        shell: bash
        run: |
          set -euo pipefail
          cmp firefox/diagnostics.js chrome/diagnostics.js
          cmp firefox/trim.js chrome/trim.js
          cmp firefox/trim-logical.js chrome/trim-logical.js
          cmp firefox/trim-pipeline.js chrome/trim-pipeline.js
          cmp firefox/conversation-endpoint.js chrome/conversation-endpoint.js
          cmp firefox/pagination-firewall.js chrome/pagination-firewall.js
          cmp firefox/session-auth.js chrome/session-auth.js
          cmp firefox/stall-recovery.js chrome/stall-recovery.js
          cmp firefox/archive.js chrome/archive.js
          cmp firefox/conversation-scope.js chrome/conversation-scope.js
          cmp firefox/archive-export.js chrome/archive-export.js
          cmp firefox/archive-export.css chrome/archive-export.css
          cmp firefox/archive-capture.js chrome/archive-capture.js
          cmp firefox/export-extract.js chrome/export-extract.js
          cmp firefox/dom-ready.js chrome/dom-ready.js
          cmp firefox/history-markdown.js chrome/history-markdown.js
          cmp firefox/history-virtualized.js chrome/history-virtualized.js
          cmp firefox/history-virtualized.css chrome/history-virtualized.css
          cmp firefox/history-fidelity.js chrome/history-fidelity.js
          cmp firefox/history-fidelity.css chrome/history-fidelity.css
          cmp firefox/history-hydration-safe.js chrome/history-hydration-safe.js
          cmp firefox/history-overlay.js chrome/history-overlay.js
          cmp firefox/windowed.js chrome/windowed.js
          cmp firefox/debug-state.js chrome/debug-state.js
          cmp firefox/content.css chrome/content.css
          cmp firefox/popup.html chrome/popup.html
          cmp firefox/popup.css chrome/popup.css
          cmp firefox/popup-sizing.css chrome/popup-sizing.css
          cmp firefox/popup-context.js chrome/popup-context.js
          cmp firefox/backup-popup.js chrome/backup-popup.js
      - name: Reject dynamic code execution
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn --include='*.js' '(^|[^[:alnum:]_])(eval|Function)[[:space:]]*\(' firefox chrome; then
            echo "Dynamic code execution is not allowed in GPT AntiCurse." >&2
            exit 1
          fi
      - name: Run unit and code-quality tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test-trim.js
            tests/test-trim-logical.js
            tests/test-archive.js
            tests/test-archive-export.js
            tests/test-export-extract.js
            tests/test-diagnostics.js
            tests/test-counter-ordering.js
            tests/test-stats-scope.js
            tests/test-history-inline.js
            tests/test-history-virtualized.js
            tests/test-history-fidelity.js
            tests/test-history-request-loop.js
            tests/test-packaging.js
            tests/test-firefox-android.js
            tests/test-firefox-export-bypass.js
            tests/test-no-silent-catches.js
            tests/test-chrome-host-access.js
            tests/test-reliability.js
            tests/test-pagination-firewall.js
            tests/test-conversation-endpoints.js
            tests/test-stall-recovery.js
          )
          for test in "${tests[@]}"; do
            echo "==> $test"
            output_file="$(mktemp)"
            if node "$test" >"$output_file" 2>&1; then
              cat "$output_file"
              rm -f "$output_file"
              continue
            fi
            cat "$output_file"
            summary="$(grep -m1 -E 'AssertionError|Error \[ERR_|Error:' "$output_file" || true)"
            if [ -z "$summary" ]; then summary="$(head -n 4 "$output_file" | tr '\n' ' ')"; fi
            summary="$(printf '%s' "$summary" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            rm -f "$output_file"
            echo "::error file=$test::${summary:-Unit/code-quality test failed}"
            exit 1
          done
      - name: Build browser packages
        run: bash ./scripts/build.sh
      - name: Install browser E2E runtimes
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 selenium-webdriver@4.46.0
          npx playwright install --with-deps --no-shell chromium
          curl -L --fail --retry 3 -o /tmp/firefox.tar.xz 'https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US'
          mkdir -p /tmp/anticurse-firefox
          tar -xf /tmp/firefox.tar.xz -C /tmp/anticurse-firefox --strip-components=1
          echo "FIREFOX_BIN=/tmp/anticurse-firefox/firefox" >> "$GITHUB_ENV"
          echo '127.0.0.1 chatgpt.com' | sudo tee -a /etc/hosts >/dev/null
      - name: Run Chromium extension E2E
        run: node tests/e2e-chromium.js
      - name: Run Chromium stall-recovery E2E
        run: node tests/e2e-stall-recovery-chromium.js
      - name: Run Chromium hydration-boundary E2E
        run: node tests/e2e-hydration-chromium.js
      - name: Run Chromium native-fidelity E2E
        run: node tests/e2e-fidelity-chromium.js
      - name: Run Firefox extension E2E
        run: node tests/e2e-firefox.js
      - name: Run Firefox stall-recovery E2E
        run: node tests/e2e-stall-recovery-firefox.js
      - name: Run Firefox native-fidelity E2E
        run: node tests/e2e-fidelity-firefox.js
      - name: Create GitHub Release if missing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("firefox/manifest.json"))["version"])')"
          CHROME_VERSION="$(python -c 'import json; print(json.load(open("chrome/manifest.json"))["version"])')"
          test "$VERSION" = "$CHROME_VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            dist/gpt-anticurse-firefox-v${VERSION}.zip \
            dist/gpt-anticurse-chrome-v${VERSION}.zip \
            --target "$GITHUB_SHA" \
            --title "GPT AntiCurse $TAG" \
            --notes-file RELEASE_NOTES.md
