name: Build updated live smoke ZIP

on:
  pull_request:

permissions:
  contents: write

jobs:
  build-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply live smoke fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-live-smoke-regressions.py')
          text = p.read_text()
          old = '''def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}\\n--- old ---\\n{old[:500]}")
              p.write_text(text.replace(old, new, 1))'''
          new = '''def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}\\n--- old ---\\n{old[:500]}")
              p.write_text(text.replace(old, new, 1))'''
          if old not in text and new not in text:
              raise SystemExit('could not locate replace_once helper')
          if old in text:
              p.write_text(text.replace(old, new, 1))
          PY
          python scripts/apply-live-smoke-regressions.py

          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: shell-loading patch anchor missing')
              p.write_text(text.replace(old, new, 1))

          for path in ['firefox/stall-recovery.js', 'chrome/stall-recovery.js']:
              once(path,
          '''  function hasUserDraft() { return !!draftText() || hasAttachmentDraft(); }
            function composerContainsOnlyNudge() { return draftText() === "." && !hasAttachmentDraft(); }''',
          '''  function hasUserDraft() { return !!draftText() || hasAttachmentDraft(); }
            function composerContainsOnlyNudge() { return draftText() === "." && !hasAttachmentDraft(); }

            function shellLoading() {
              const input = composer();
              const form = (input && input.closest('form[data-type="unified-composer"]')) || document.querySelector('form[data-type="unified-composer"]');
              if (form && (form.hasAttribute("inert") || form.inert === true)) return true;
              return !!(activeTurn && !activeTurn.isConnected);
            }''')

              p = Path(path)
              text = p.read_text()
              text = text.replace('if (preOutputLoading(activeTurn)) return null;', 'if (shellLoading() || preOutputLoading(activeTurn)) return null;')
              text = text.replace('const loading = preOutputLoading(activeTurn);', 'const loading = shellLoading() || preOutputLoading(activeTurn);')
              text = text.replace('if (preOutputLoading(activeTurn)) { publishRecoveryStatus(); return; }', 'if (shellLoading() || preOutputLoading(activeTurn)) { publishRecoveryStatus(); return; }')
              text = text.replace('''      if (turnList && turnList.isConnected) return;
                turnList = null;''', '''      if (turnList && turnList.isConnected) return;
                if (activeTurn && !activeTurn.isConnected) observeActiveTurn(null);
                turnList = null;''')
              text = text.replace('''        assistantOutputPresent: hasAssistantOutput(),
                preOutputLoading: preOutputLoading(),''', '''        assistantOutputPresent: hasAssistantOutput(),
                preOutputLoading: preOutputLoading(),
                shellLoading: shellLoading(),''')
              p.write_text(text)

          for path in ['firefox/content.js', 'chrome/content.js']:
              p = Path(path)
              text = p.read_text()
              text = text.replace('response loading · recovery not armed', 'response loading · recovery not armed')
              p.write_text(text)
          PY

          git diff --check

      - name: Relevant regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            tests/test-stall-recovery.js \
            tests/test-pro-recovery-guard.js \
            tests/test-paginated-history-accumulator.js \
            tests/test-firefox-history-source-priority.js \
            tests/test-firefox-conversation-rate-limit-guard.js \
            tests/test-history-request-loop.js \
            tests/test-packaging.js; do
            node "$test"
          done
          for file in firefox/*.js chrome/*.js; do node --check "$file"; done
          cmp firefox/pro-recovery-guard.js chrome/pro-recovery-guard.js
          cmp firefox/stall-recovery.js chrome/stall-recovery.js
          cmp firefox/content.js chrome/content.js

      - name: Build ZIPs
        run: bash ./scripts/build.sh

      - name: Commit tested fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add firefox chrome tests scripts .github/workflows/release.yml
            git commit -m "Fix live history capture and recovery arming"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Upload updated 0.7.5 candidate
        uses: actions/upload-artifact@v4
        with:
          name: gpt-anticurse-0.7.5-live-smoke-updated
          path: dist/*.zip
          retention-days: 1
